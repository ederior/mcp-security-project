[project]
name = "mcp-security-project"
version = "0.1.0"
description = "Security research framework for MCP-based AI agents"
requires-python = ">=3.11"

dependencies = [
    "mcp==1.27.2",
    "google-genai==2.8.0",
    "python-dotenv==1.2.2",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
