[project]
name = "mcp-security-project"
version = "0.1.0"
description = "Security research framework for MCP-based AI agents"
requires-python = ">=3.11"

dependencies = [
    "mcp==1.27.2",
    "google-genai==2.8.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
